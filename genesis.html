<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Design - Genesis</title>
<style>
    body { margin: 0; overflow: hidden; background: #222; }
    /* sans touch-action le navigateur mobile prend le tap pour un scroll ou un zoom */
    canvas { display: block; cursor: pointer; touch-action: none; }

    .panel {
        position: absolute;
        left: 10px;
        padding: 10px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: 14px monospace;
        pointer-events: none;
    }
    #stats { top: 10px; }
    #stats h3 { margin: 0 0 8px; }
    #stats p { margin: 4px 0; }
    #stats ul { margin: 4px 0 8px; padding-left: 18px; }
    #tip { bottom: 10px; opacity: 0.8; transition: opacity 1s ease-out; }
    #tip.hidden { opacity: 0; }

    .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 5px;
        border-radius: 50%;
    }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="stats" class="panel"></div>
<div id="tip" class="panel">Click a cell to boost its energy | Click empty space to disturb cells | Triple click to restart</div>

<script>
const config = {
    initialCellsPerFamily: 4,
    maxCells: 50,
    overeatThreshold: 180, // au-delà la cellule gonfle et éclate
    attractionDistance: 100,   // rayon de recrutement d'une colonie
    fragmentationChance: 0.3,
    cannibalismThreshold: 1.3, // ratio de taille pour manger une cellule de sa famille
    collisionDampingFactor: 0.8, // restitution sur la normale de contact
    colonySpacing: 25,
    connectionLineDistanceMin: 50,
    connectionLineDistanceMax: 150,
    connectionLineWidth: 2,
    cannibalismFlashDuration: 15,
    energyBoost: 20,
    impactRadius: 180,
    poisonChance: 0.2,
    poisonEnergyMultiplier: 2,
    poisonDeathGlowDuration: 30
};

// Toute la simu compte en frames à 60 Hz. Sur un écran 120/144 Hz la boucle rAF tournait deux fois
// plus vite et tout vieillissait deux fois plus vite : on avance par pas fixes, cf. loop()
const STEP_MS = 1000 / 60;
const MAX_STEPS_PER_FRAME = 5;   // retour d'onglet : pas de rattrapage sur des minutes

const MIN_RADIUS = 3;
const MAX_RADIUS = 30;
const MAX_ENERGY = 200;
const BURST_FRAMES = 20;
const FRAGMENT_FRAMES = 15;
const HEAL_FRAMES = 20;
const TRIPLE_CLICK_MS = 400;

const FAMILIES = {
    blue: '#3498db',
    purple: '#9b59b6',
    turquoise: '#1abc9c',
    orange: '#f39c12',
    green: '#2ecc71',
    red: '#e74c3c'
};
const FAMILY_COLORS = Object.values(FAMILIES);
const FAMILY_NAMES = Object.fromEntries(Object.entries(FAMILIES).map(([name, hex]) => [hex, name]));

// en "r, g, b" pour y coller une alpha au dessin
const FLASH_POISON = '0, 255, 0';
const FLASH_HEAL = '255, 255, 255';
const FLASH_CURE = '0, 255, 255';

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const statsDiv = document.getElementById('stats');
const tipDiv = document.getElementById('tip');

let width = 0;
let height = 0;

let cells = [];
let food = [];
let effects = [];
let stats;
let stepCount = 0;
let screenFlash = 0;

// Naissances pendant la mise à jour, ajoutées à la fin du pas : on ne touche pas à cells pendant qu'on le parcourt
let newCells = [];
let newFood = [];

let clickCount = 0;
let lastClickTime = 0;

// ----- couleurs

let rgbCache = {};
function rgb(hex) {
    if (!rgbCache[hex]) rgbCache[hex] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    return rgbCache[hex];
}
function rgba(hex, alpha) {
    return `rgba(${rgb(hex).join(', ')}, ${alpha})`;
}
function lighten(hex, factor) {
    let [r, g, b] = rgb(hex).map(v => Math.floor(v + (255 - v) * factor));
    return `rgb(${r}, ${g}, ${b})`;
}

// Mélanges connus, dans les deux sens. Le reste tombe sur la famille la plus proche de la moyenne RGB
const MIX_RULES = [
    ['blue', 'orange', 'purple'],
    ['red', 'blue', 'purple'],
    ['blue', 'green', 'turquoise'],
    ['red', 'orange', 'orange'],
    ['green', 'red', 'orange']
];
let mixTable = {};
for (let [a, b, result] of MIX_RULES) {
    mixTable[FAMILIES[a] + FAMILIES[b]] = FAMILIES[result];
    mixTable[FAMILIES[b] + FAMILIES[a]] = FAMILIES[result];
}

function mixFamilies(c1, c2) {
    if (mixTable[c1 + c2]) return mixTable[c1 + c2];

    let a = rgb(c1), b = rgb(c2);
    let mid = [0, 1, 2].map(i => (a[i] + b[i]) / 2);
    let best = FAMILY_COLORS[0];
    let bestDist = Infinity;
    for (let color of FAMILY_COLORS) {
        let c = rgb(color);
        let d = (mid[0] - c[0]) ** 2 + (mid[1] - c[1]) ** 2 + (mid[2] - c[2]) ** 2;
        if (d < bestDist) {
            bestDist = d;
            best = color;
        }
    }
    return best;
}

const radiusFor = energy => Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, energy / 100 * 20 + 5));
const randomFamily = () => FAMILY_COLORS[Math.floor(Math.random() * FAMILY_COLORS.length)];

// ----- effets

// Dessinés par la boucle principale. Avant, chaque flash lançait sa propre boucle rAF et passait
// avant ou après le clearRect selon l'ordre des callbacks, une partie ne s'affichait jamais
function addFlash(x, y, color) {
    effects.push({ type: 'flash', x, y, color, radius: 10, maxRadius: 40, alpha: 0.8 });
}
function addRipple(x, y) {
    effects.push({ type: 'ripple', x, y, radius: 0, maxRadius: config.impactRadius, alpha: 0.5 });
}

function updateEffects() {
    for (let fx of effects) {
        if (fx.type === 'flash') {
            fx.radius += 4;
            fx.alpha -= 0.05;
        } else {
            fx.radius += 6;
            fx.alpha -= 0.02;
        }
    }
    effects = effects.filter(fx => fx.alpha > 0 && fx.radius < fx.maxRadius);
    if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - 0.04);
}

function drawEffects() {
    for (let fx of effects) {
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);
        if (fx.type === 'flash') {
            ctx.fillStyle = `rgba(${fx.color}, ${fx.alpha})`;
            ctx.fill();
        } else {
            ctx.strokeStyle = `rgba(255, 255, 255, ${fx.alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }
    if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
        ctx.fillRect(0, 0, width, height);
    }
}

// ----- nourriture

class Food {
    constructor(x, y, radius, energy, poisoned) {
        this.x = x ?? Math.random() * width;
        this.y = y ?? Math.random() * height;
        this.radius = radius ?? Math.random() * 2 + 1;
        this.energy = energy ?? Math.random() * 15 + 5;
        this.poisoned = poisoned ?? Math.random() < config.poisonChance;
        // la couleur suit le poison : forcé après le constructeur, il gardait la couleur d'une particule saine
        this.color = this.poisoned
            ? `rgba(0, 220, 0, ${Math.random() * 0.5 + 0.5})`
            : `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.3})`;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        ctx.shadowBlur = this.radius;
        ctx.shadowColor = this.poisoned ? '#00ff00' : this.color;
        ctx.strokeStyle = this.poisoned ? 'rgba(0, 255, 0, 0.8)' : 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = this.poisoned ? 2 : 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

// ----- cellules

// state : 'alive', 'bursting' (trop mangé), 'fragmenting' (attaquée), 'withering' (morte empoisonnée)
class Cell {
    constructor(x, y, color, speedX, speedY, energy = 100) {
        this.x = x ?? Math.random() * width;
        this.y = y ?? Math.random() * height;
        this.color = color || randomFamily();
        this.speedX = speedX ?? (Math.random() - 0.5) * 3;
        this.speedY = speedY ?? (Math.random() - 0.5) * 3;
        this.energy = energy;
        this.radius = radiusFor(energy);
        this.energyLossRate = 0.03;

        this.state = 'alive';
        this.stateTimer = 0;
        this.removed = false;
        this.poisoned = false;
        this.healTimer = 0;
        this.flashTimer = 0;   // flash rouge du cannibalisme

        this.role = 'none';   // 'none', 'center' ou 'satellite'
        this.center = null;
        this.orbitAngle = 0;
        this.orbitSpeed = 0;
    }

    get active() {
        return this.state === 'alive' && !this.removed;
    }

    setState(state) {
        this.state = state;
        this.stateTimer = 0;
    }

    distanceTo(other) {
        return Math.hypot(this.x - other.x, this.y - other.y);
    }
    overlaps(other) {
        return this.distanceTo(other) < this.radius + other.radius;
    }
    contains(x, y) {
        return Math.hypot(this.x - x, this.y - y) < this.radius;
    }

    randomPointAround(spread) {
        let a = Math.random() * Math.PI * 2;
        let d = Math.random() * spread;
        return [this.x + Math.cos(a) * d, this.y + Math.sin(a) * d];
    }

    // ---- interactions

    boost(amount) {
        // Plafond sous le seuil d'obésité, un clic ne doit jamais faire éclater la cellule.
        // Au-dessus du plafond on ne touche à rien : avant, le clic lui retirait de l'énergie
        let cap = config.overeatThreshold * 0.8;
        if (this.energy < cap) this.energy = Math.min(cap, this.energy + amount);
        this.radius = radiusFor(this.energy);

        if (this.poisoned && Math.random() < 0.5) {
            this.poisoned = false;
            addFlash(this.x, this.y, FLASH_CURE);
        }
        this.healTimer = HEAL_FRAMES;
        addFlash(this.x, this.y, FLASH_HEAL);
        stats.healings++;
    }

    // onde de choc d'un clic dans le vide, true si la cellule est dans le rayon
    push(x, y, radius) {
        let dx = this.x - x;
        let dy = this.y - y;
        let dist = Math.hypot(dx, dy);
        if (dist >= radius) return false;

        let force = (1 - dist / radius) * 5;
        if (dist < 0.001) {
            // pile sur le clic : direction au hasard plutôt qu'une division par zéro
            let a = Math.random() * Math.PI * 2;
            dx = Math.cos(a);
            dy = Math.sin(a);
            dist = 1;
        }
        this.speedX += dx / dist * force;
        this.speedY += dy / dist * force;

        let speed = Math.hypot(this.speedX, this.speedY);
        if (speed > 6) {
            this.speedX *= 6 / speed;
            this.speedY *= 6 / speed;
        }
        return true;
    }

    eat(particle) {
        this.energy = Math.min(MAX_ENERGY, this.energy + particle.energy);
        this.radius = radiusFor(this.energy);
        if (particle.poisoned && !this.poisoned) {
            this.poisoned = true;
            addFlash(this.x, this.y, FLASH_POISON);
        }
        stats.foodConsumed++;
    }

    collide(other) {
        if (this.color === other.color) {
            // Dans les deux sens : avant seule la première du tableau pouvait manger ou attaquer.
            // Le 50% garde à peu près l'équilibre de l'époque (sans lui la population chute d'un tiers)
            let [big, small] = this.radius >= other.radius ? [this, other] : [other, this];

            if (big.radius > small.radius * config.cannibalismThreshold && big.energy > small.energy
                && Math.random() < 0.5) {
                big.devour(small);
                return;
            }
            // une petite cellule en forme peut faire éclater une grosse
            if (small.radius < big.radius * 0.8 && small.energy > 80 && big.radius > 15
                && Math.random() < config.fragmentationChance) {
                big.setState('fragmenting');
                small.energy -= 20;
                stats.attacks++;
                return;
            }
        } else if (Math.random() < 0.5) {
            this.mutateWith(other);
        }

        // la plus grosse pompe 10% de l'énergie de la plus petite
        if (this.radius !== other.radius) {
            let [big, small] = this.radius > other.radius ? [this, other] : [other, this];
            let transfer = small.energy * 0.1;
            big.energy += transfer;
            small.energy -= transfer;
        }

        this.bounceOff(other);
    }

    devour(prey) {
        this.energy += prey.energy * 0.7;
        this.radius = radiusFor(this.energy);
        this.flashTimer = config.cannibalismFlashDuration;

        // manger une cellule saine peut guérir, une empoisonnée peut contaminer
        if (this.poisoned && !prey.poisoned) {
            if (Math.random() < 0.5) this.poisoned = false;
        } else if (!this.poisoned && prey.poisoned && Math.random() < 0.3) {
            this.poisoned = true;
            addFlash(this.x, this.y, FLASH_POISON);
        }

        prey.removed = true;
        stats.cannibalism++;
    }

    mutateWith(other) {
        let color = mixFamilies(this.color, other.color);
        for (let cell of [this, other]) {
            // red + orange donne orange, seule la rouge change vraiment de famille
            if (cell.color !== color) {
                cell.color = color;
                stats.mutations++;
            }
            cell.energy += 10;
        }
    }

    // Choc élastique sur la normale de contact, masse ~ rayon. Avant, les vitesses entières étaient
    // échangées à chaque frame de chevauchement, et deux cellules superposées donnaient des NaN
    bounceOff(other) {
        let dx = other.x - this.x;
        let dy = other.y - this.y;
        let dist = Math.hypot(dx, dy);
        let overlap = (this.radius + other.radius - dist) / 2;
        if (dist < 0.001) {
            let a = Math.random() * Math.PI * 2;
            dx = Math.cos(a);
            dy = Math.sin(a);
            dist = 1;
        }
        let nx = dx / dist;
        let ny = dy / dist;

        this.x -= nx * overlap;
        this.y -= ny * overlap;
        other.x += nx * overlap;
        other.y += ny * overlap;

        let approach = (other.speedX - this.speedX) * nx + (other.speedY - this.speedY) * ny;
        if (approach >= 0) return;   // elles s'éloignent déjà

        let impulse = -(1 + config.collisionDampingFactor) * approach / (1 / this.radius + 1 / other.radius);
        this.speedX -= impulse / this.radius * nx;
        this.speedY -= impulse / this.radius * ny;
        other.speedX += impulse / other.radius * nx;
        other.speedY += impulse / other.radius * ny;
    }

    // ---- mise à jour

    // un pas de simu, false quand la cellule doit disparaître
    update() {
        if (this.healTimer > 0) this.healTimer--;
        if (this.flashTimer > 0) this.flashTimer--;

        if (this.state !== 'alive') return this.updateDying();

        if (this.role === 'satellite') {
            if (this.center && !this.center.removed) {
                this.orbit();
            } else {
                this.role = 'none';
                this.center = null;
            }
        }

        this.x += this.speedX;
        this.y += this.speedY;
        this.energy -= this.energyLossRate * (this.poisoned ? config.poisonEnergyMultiplier : 1);
        this.radius = radiusFor(this.energy);

        if (this.energy > config.overeatThreshold) {
            this.setState('bursting');
            stats.obesityDeaths++;
            return true;
        }
        if (this.energy <= 0) {
            if (!this.poisoned) {
                stats.deaths++;
                return false;
            }
            this.setState('withering');
            stats.poisonDeaths++;
            addFlash(this.x, this.y, FLASH_POISON);
            return true;
        }

        this.bounceWalls();
        return true;
    }

    orbit() {
        let c = this.center;
        this.orbitAngle += this.orbitSpeed;
        let dist = c.radius + this.radius + config.colonySpacing;
        this.speedX = (c.x + Math.cos(this.orbitAngle) * dist - this.x) * 0.1;
        this.speedY = (c.y + Math.sin(this.orbitAngle) * dist - this.y) * 0.1;
    }

    updateDying() {
        this.stateTimer++;

        if (this.state === 'bursting' && this.stateTimer >= BURST_FRAMES) {
            // de grosses particules qui rendent la moitié de son énergie
            let count = Math.floor(this.energy / 20) + 2;
            for (let i = 0; i < count; i++) {
                let [x, y] = this.randomPointAround(this.radius * 1.5);
                newFood.push(new Food(x, y, Math.random() * 2 + 2, this.energy / count * 0.5));
            }
            return false;
        }

        if (this.state === 'withering' && this.stateTimer >= config.poisonDeathGlowDuration) {
            let count = Math.floor(this.radius / 3) + 1;
            for (let i = 0; i < count; i++) {
                let [x, y] = this.randomPointAround(this.radius);
                newFood.push(new Food(x, y, Math.random() * 2 + 1, Math.random() * 5 + 5, Math.random() < 0.75));
            }
            return false;
        }

        if (this.state === 'fragmenting' && this.stateTimer >= FRAGMENT_FRAMES) {
            let count = Math.floor(Math.random() * 2) + 3;
            for (let i = 0; i < count; i++) {
                let a = i / count * Math.PI * 2;
                let frag = new Cell(
                    this.x + Math.cos(a) * this.radius,
                    this.y + Math.sin(a) * this.radius,
                    this.color, Math.cos(a) * 2, Math.sin(a) * 2, this.energy / count);
                frag.poisoned = this.poisoned;
                newCells.push(frag);
            }
            return false;
        }

        return true;
    }

    // rebond sur les bords : parfois une division, sinon un peu d'énergie perdue
    bounceWalls() {
        let divided = false;

        if (this.x + this.radius > width) {
            this.x = width - this.radius;
            this.speedX = -Math.abs(this.speedX);
            divided = this.hitWall();
        } else if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.speedX = Math.abs(this.speedX);
            divided = this.hitWall();
        }

        if (this.y + this.radius > height) {
            this.y = height - this.radius;
            this.speedY = -Math.abs(this.speedY);
            if (!divided) this.hitWall();
        } else if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.speedY = Math.abs(this.speedY);
            if (!divided) this.hitWall();
        }
    }

    hitWall() {
        if (this.radius > 15 && Math.random() < 0.2) {
            this.divide();
            return true;
        }
        this.energy -= 5;
        return false;
    }

    divide() {
        let a = Math.random() * Math.PI * 2;
        let x = this.x + Math.cos(a) * this.radius;
        let y = this.y + Math.sin(a) * this.radius;

        // partage 60/40, l'enfant naissait avec 100 d'énergie sortie de nulle part
        let childEnergy = this.energy * 0.4;
        this.energy *= 0.6;
        this.radius = radiusFor(this.energy);

        let child = new Cell(x, y, this.color,
            this.speedX * 0.8 + Math.random() - 0.5,
            this.speedY * 0.8 + Math.random() - 0.5,
            childEnergy);
        child.poisoned = this.poisoned;
        newCells.push(child);
        stats.births++;
    }

    // ---- dessin

    draw() {
        if (this.role === 'satellite' && this.center) {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.center.x, this.center.y);
            ctx.strokeStyle = rgba(this.color, 0.2);
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        if (this.state === 'fragmenting') return this.drawFragments();
        if (this.state === 'withering') return this.drawWithering();
        if (this.state === 'bursting') this.drawBursting();
        else this.drawBody();

        if (this.flashTimer > 0) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 0, 0, ${this.flashTimer / config.cannibalismFlashDuration})`;
            ctx.fill();
        }
    }

    drawBody() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgba(this.color, Math.max(0.3, Math.min(1, this.energy / 100)));   // la santé se lit à l'opacité
        ctx.fill();

        if (this.poisoned) {
            ctx.shadowBlur = this.radius * 0.8;
            ctx.shadowColor = '#00ff00';
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
        } else if (this.healTimer > 0) {
            ctx.shadowBlur = this.radius * 1.2;
            ctx.shadowColor = '#ffffff';
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.7)';
        } else {
            ctx.shadowBlur = this.radius * 0.5;
            ctx.shadowColor = this.color;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        }
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // noyau clair qui grossit à l'approche de l'obésité
        let overfed = Math.max(0, Math.min(1, (this.energy - 100) / (config.overeatThreshold - 100)));
        if (overfed > 0) {
            let inner = this.radius * 0.5 * overfed;
            let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, inner);
            grad.addColorStop(0, lighten(this.color, 0.5));
            grad.addColorStop(1, rgba(this.color, 0));
            ctx.beginPath();
            ctx.arc(this.x, this.y, inner, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
        }

        if (this.role === 'center') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    drawBursting() {
        let p = this.stateTimer / BURST_FRAMES;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * (1 + p * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = rgba(this.color, 1 - p);
        ctx.fill();

        let inner = this.radius * p;
        let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, inner);
        grad.addColorStop(0, `rgba(255, 255, 255, ${1 - p})`);
        grad.addColorStop(0.7, `rgba(255, 220, 220, ${0.7 * (1 - p)})`);
        grad.addColorStop(1, 'rgba(255, 200, 200, 0)');
        ctx.beginPath();
        ctx.arc(this.x, this.y, inner, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
    }

    drawFragments() {
        let p = this.stateTimer / FRAGMENT_FRAMES;
        let d = this.radius * 0.5 * p;
        let size = this.radius * (1 - p * 0.5) / 2;
        ctx.fillStyle = rgba(this.color, 1 - p * 0.5);
        for (let i = 0; i < 5; i++) {
            let a = i / 5 * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawWithering() {
        let p = this.stateTimer / config.poisonDeathGlowDuration;
        let mix = p * 0.7;   // vire au vert en s'éteignant
        let [r, g, b] = rgb(this.color);

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * (1 - p * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${Math.floor(r * (1 - mix))}, ${Math.floor(g * (1 - mix) + 255 * mix)}, ${Math.floor(b * (1 - mix))}, ${1 - p * 0.7})`;
        ctx.fill();

        ctx.shadowBlur = this.radius * (1 - p * 0.5);
        ctx.shadowColor = '#00ff00';
        ctx.strokeStyle = `rgba(0, 255, 0, ${0.8 - p * 0.8})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

// ----- colonies

// Recalculées tous les 30 pas. Les rôles repartent de zéro à chaque fois (les centres restaient
// centres pour toujours) et un satellite qui garde le même centre garde aussi son orbite
function updateColonies() {
    let alive = cells.filter(c => c.active);
    let colonies = [];

    for (let cell of alive) {
        if (cell.radius <= 15) continue;
        let near = alive.filter(o => o !== cell && o.color === cell.color && cell.distanceTo(o) < config.attractionDistance);
        if (near.length >= 2) colonies.push({ center: cell, members: near });
    }

    let centers = new Set(colonies.map(c => c.center));
    let assigned = new Map();
    for (let { center, members } of colonies) {
        for (let m of members) {
            if (!centers.has(m) && !assigned.has(m)) assigned.set(m, center);
        }
    }

    for (let cell of cells) {
        let center = assigned.get(cell) || null;
        if (center && center !== cell.center) {
            // on part de l'angle actuel, sinon la cible d'orbite saute d'un coup
            cell.orbitAngle = Math.atan2(cell.y - center.y, cell.x - center.x);
            cell.orbitSpeed = Math.random() * 0.02 + 0.01;
        }
        cell.center = center;
        cell.role = centers.has(cell) ? 'center' : center ? 'satellite' : 'none';
    }

    stats.colonies = colonies.length;
}

// liens entre cellules d'une même famille à distance moyenne, plafonnés pour garder la frame légère
function drawConnections() {
    let max = Math.min(150, cells.length * 5);
    let minSq = config.connectionLineDistanceMin ** 2;
    let maxSq = config.connectionLineDistanceMax ** 2;
    let drawn = 0;

    ctx.lineWidth = config.connectionLineWidth;
    for (let i = 0; i < cells.length && drawn < max; i++) {
        let a = cells[i];
        for (let j = i + 1; j < cells.length && drawn < max; j++) {
            let b = cells[j];
            if (a.color !== b.color) continue;
            let d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
            if (d < minSq || d > maxSq) continue;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = rgba(a.color, 0.3);
            ctx.stroke();
            drawn++;
        }
    }
}

// ----- stats

function freshStats() {
    return {
        births: 0, deaths: 0, poisonDeaths: 0, obesityDeaths: 0, foodConsumed: 0,
        mutations: 0, cannibalism: 0, attacks: 0, colonies: 0, healings: 0, disturbances: 0
    };
}

// Familles recomptées à chaque affichage. Tenues à la main elles dérivaient : obésité et fragmentation
// n'étaient jamais décomptées, et un reset comptait toutes les cellules deux fois
function renderStats() {
    let counts = {};
    let total = 0;
    for (let c of cells) {
        if (!c.active) continue;
        counts[c.color] = (counts[c.color] || 0) + 1;
        total++;
    }

    let families = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([color, n]) => `<li><span class="swatch" style="background:${color}"></span>${FAMILY_NAMES[color] || 'unknown'}: ${n} cells</li>`)
        .join('');
    let line = (label, value) => `<p><strong>${label}:</strong> ${value}</p>`;

    statsDiv.innerHTML = '<h3>Statistics</h3>'
        + `<p><strong>Cell Families:</strong></p><ul>${families}</ul>`
        + line('Births', stats.births)
        + line('Natural Deaths', stats.deaths)
        + line('Poison Deaths', stats.poisonDeaths)
        + line('Obesity Deaths', stats.obesityDeaths)
        + line('Food Consumed', stats.foodConsumed)
        + line('Mutations', stats.mutations)
        + line('Cannibalism', stats.cannibalism)
        + line('Attacks', stats.attacks)
        + line('Active Colonies', stats.colonies)
        + line('Healings', stats.healings)
        + line('Disturbances', stats.disturbances)
        + line('Total Cells', total);
}

// ----- monde

function populate() {
    cells = [];
    food = [];
    effects = [];
    newCells = [];
    newFood = [];
    stats = freshStats();
    for (let color of FAMILY_COLORS) {
        for (let i = 0; i < config.initialCellsPerFamily; i++) cells.push(new Cell(undefined, undefined, color));
    }
}

function resetSimulation() {
    populate();
    screenFlash = 0.6;
    renderStats();
}

function spawnCell() {
    cells.push(new Cell());
    stats.births++;
}

function resize() {
    let dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Après un rétrécissement, la nourriture restée hors cadre était inatteignable
    // et bloquait l'apparition de nouvelle (plafond à 15)
    food = food.filter(f => f.x < width && f.y < height);
}

function handleClick(x, y) {
    let now = performance.now();
    clickCount = now - lastClickTime < TRIPLE_CLICK_MS ? clickCount + 1 : 1;
    lastClickTime = now;
    if (clickCount >= 3) {
        clickCount = 0;
        resetSimulation();
        return;
    }

    // la dernière du tableau est dessinée par-dessus, c'est elle qu'on vise
    for (let i = cells.length - 1; i >= 0; i--) {
        if (cells[i].active && cells[i].contains(x, y)) {
            cells[i].boost(config.energyBoost);
            return;
        }
    }

    let hit = 0;
    for (let c of cells) {
        if (c.active && c.push(x, y, config.impactRadius)) hit++;
    }
    if (hit > 0) {
        stats.disturbances++;
        addRipple(x, y);
    }
}

canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    let rect = canvas.getBoundingClientRect();
    handleClick(e.clientX - rect.left, e.clientY - rect.top);
});

// ----- simulation

function step() {
    stepCount++;
    if (stepCount % 30 === 0) updateColonies();
    if (food.length < 15 && Math.random() < 0.05) food.push(new Food());

    for (let i = 0; i < cells.length; i++) {
        let a = cells[i];
        // a peut se faire manger ou fragmenter en cours de route
        for (let j = i + 1; j < cells.length && a.active; j++) {
            let b = cells[j];
            if (b.active && a.overlaps(b)) a.collide(b);
        }
    }

    for (let cell of cells) {
        if (!cell.active) continue;
        for (let i = food.length - 1; i >= 0; i--) {
            let f = food[i];
            if (Math.hypot(cell.x - f.x, cell.y - f.y) < cell.radius + f.radius) {
                cell.eat(f);
                food.splice(i, 1);
            }
        }
    }

    cells = cells.filter(cell => {
        if (!cell.removed && cell.update()) return true;
        cell.removed = true;
        return false;
    });
    cells.push(...newCells);
    food.push(...newFood);
    newCells = [];
    newFood = [];

    // naissances spontanées, pour que l'écosystème ne s'éteigne pas
    if (cells.length < config.maxCells * 0.75 && Math.random() < 0.01) spawnCell();
    if (cells.length < 5 && Math.random() < 0.1) {
        for (let i = 0; i < 3; i++) spawnCell();
    }
    if (cells.length > config.maxCells) {
        for (let cell of cells.splice(config.maxCells)) cell.removed = true;
    }

    updateEffects();
    if (stepCount % 10 === 0) renderStats();
}

function render() {
    ctx.clearRect(0, 0, width, height);
    for (let f of food) f.draw();
    for (let c of cells) c.draw();
    drawConnections();
    drawEffects();
}

let lastTime = performance.now();
let lag = 0;

function loop(now) {
    lag += Math.min(Math.max(0, now - lastTime), STEP_MS * MAX_STEPS_PER_FRAME);
    lastTime = now;
    // 1 ms de marge : à 60 Hz l'intervalle rAF oscille autour de 16.67 ms, sans elle on
    // alternerait des frames à 0 et 2 pas (saccades)
    while (lag >= STEP_MS - 1) {
        step();
        lag -= STEP_MS;
    }
    render();
    requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize', resize);
populate();
renderStats();
setTimeout(() => tipDiv.classList.add('hidden'), 10000);
requestAnimationFrame(loop);
</script>
</body>
</html>
